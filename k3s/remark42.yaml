---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: remark42-data
  namespace: blog
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: remark42
  namespace: blog
spec:
  replicas: 1
  # ReadWriteOnce のボリュームを使うため、新旧 Pod の同時起動を避ける
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: remark42
  template:
    metadata:
      labels:
        app: remark42
    spec:
      containers:
        - name: remark42
          image: ghcr.io/umputun/remark42:v1.14.0
          ports:
            - containerPort: 8080
          env:
            - name: REMARK_URL
              value: "https://r.doany.io"
            - name: SITE
              value: "doany"
            # アカウント登録なしでコメントできるようにする
            - name: AUTH_ANON
              value: "true"
            - name: EMOJI
              value: "true"
            - name: TIME_ZONE
              value: "Asia/Tokyo"
            # doany.io から埋め込むための許可
            - name: ALLOWED_HOSTS
              value: "self,doany.io,https://doany.io"
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: remark42-secrets
                  key: secret
            # モデレーション用の管理者ログイン (ユーザー名 admin)
            - name: ADMIN_PASSWD
              valueFrom:
                secretKeyRef:
                  name: remark42-secrets
                  key: admin-passwd
          volumeMounts:
            - name: data
              mountPath: /srv/var
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
          livenessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: remark42-data
---
apiVersion: v1
kind: Service
metadata:
  name: remark42
  namespace: blog
spec:
  selector:
    app: remark42
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remark42
  namespace: blog
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: mydnschallenge
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - r.doany.io
  rules:
    - host: r.doany.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remark42
                port:
                  number: 80
