name: Zenn Sync

# Zenn はリポジトリ直下の articles/*.md しか読まず、ベースディレクトリも
# 指定できない。生成物を main に置きたくないので、専用の zenn ブランチへ
# 出力し、Zenn の同期対象をそちらに向けている。
on:
  push:
    branches: [main]
    paths:
      - "src/content/posts/**.md"
      - "scripts/zenn-sync.mjs"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/zenn-sync.mjs

      - name: Publish to the zenn branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # zenn ブランチは articles/ だけを持つ生成物用のブランチ。
          # 別クローンに差し替えて push する (main の作業ツリーには触らない)。
          work=$(mktemp -d)
          git clone --quiet --branch zenn --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$work"

          rm -rf "$work/articles"
          cp -r articles "$work/articles"

          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A articles

          if git diff --cached --quiet; then
            echo "変更なし"
            exit 0
          fi

          git commit -m "chore: sync Zenn articles from ${GITHUB_SHA}"
          git push origin zenn
